name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/tontine/api/apps/api
            git pull origin main
            npm install --production=false
            npx prisma generate
            npm run build
            pm2 restart tontine-api || pm2 start dist/index.js --name tontine-api
            pm2 save
