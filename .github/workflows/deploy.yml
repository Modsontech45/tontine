name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 65.109.7.122
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /home/tontine/api
            git pull origin main
            npm install --production=false
            npx prisma generate
            npm run build
            pm2 restart prospera-api
            pm2 save
